[project]
name = "escalator"
version = "0.1.0"
description = "A Strands agent that only pays for a big Bedrock model when Strands Decider 2B says it has to."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["strands-agents>=1.0", "boto3"]

[project.optional-dependencies]
decider = ["strands-decider"]
dev = ["pytest"]

[project.scripts]
escalator = "escalator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["escalator"]
